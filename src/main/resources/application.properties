# ===================================================================
# FileDrop Application Configuration
# ===================================================================
spring.application.name=FileDrop
server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database Configuration
# Supports MySQL with automatic H2 fallback if MySQL is not configured
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:filedrop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# H2 Console (enabled for inspection in local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# FileDrop Application Properties
# -------------------------------------------------------------------
# Room expiration timeout in minutes
filedrop.room.expiration-minutes=60

# Max allowed file size in bytes for metadata validation (10 GB)
filedrop.transfer.max-file-size=10737418240

# WebRTC STUN/TURN servers configuration (JSON formatted or comma-separated)
filedrop.webrtc.ice-servers=[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302"]}]

# WebSocket buffer and timeout settings
spring.websocket.send-time-limit=20000
spring.websocket.send-buffer-size-limit=524288

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
