# ===================================================================
# FileDrop Production Configuration (Profile: prod)
# ===================================================================

server.port=${PORT:8080}

# Database Configuration (Falls back to H2 in-memory if no external database is configured)
spring.datasource.url=${DB_URL:jdbc:h2:mem:filedrop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 web console in production for security
spring.h2.console.enabled=false

# FileDrop Application Properties
filedrop.room.expiration-minutes=60
filedrop.transfer.max-file-size=10737418240
filedrop.webrtc.ice-servers=[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302"]}]

# WebSocket Buffer & Timeout Settings
spring.websocket.send-time-limit=20000
spring.websocket.send-buffer-size-limit=524288

# Static Resource Handling with Caching for Production
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600
